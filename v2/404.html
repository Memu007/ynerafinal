<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada | Ynera</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#E3E5DD">
<link rel="icon" type="image/svg+xml" href="/brand/ynera-favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
/* Misma receta que la landing (código de marca §4 y §5): papel liquen, tinta, musgo; Piazzolla sola. */
@font-face{font-family:"Piazzolla";src:url(/fonts/piazzolla.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{color-scheme:light;--tinta:#17131F;--papel:#E3E5DD;--musgo:#1E4D3A;--gris:#4E5249;
  --f:"Piazzolla","Iowan Old Style",Charter,Georgia,serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;background:var(--papel);color:var(--tinta);font:400 18px/1.55 var(--f);word-spacing:.03em;font-variant-numeric:oldstyle-nums;font-kerning:normal;font-optical-sizing:auto;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;padding:32px 16px}
main{width:min(100%,600px);display:grid;gap:20px}
.brand{font:700 25px/1 var(--f);letter-spacing:-.01em;text-decoration:none;color:inherit;justify-self:start;margin-bottom:28px}
h1{margin:0;font:280 clamp(44px,9vw,76px)/.98 var(--f);letter-spacing:-.022em;text-wrap:balance}
.poem{margin:0;font:320 clamp(21px,4vw,26px)/1.28 var(--f);color:var(--gris)}
p{margin:0;text-wrap:pretty}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
a.btn{display:inline-flex;align-items:center;font:620 16px/1.1 var(--f);text-decoration:none;padding:15px 22px;border:1.5px solid var(--tinta);color:var(--tinta);transition:background-color .2s,color .2s,border-color .2s}
a.btn.fill{background:var(--musgo);border-color:var(--musgo);color:var(--papel)}
a.btn.fill:hover{background:var(--tinta);border-color:var(--tinta)}
a.btn:not(.fill):hover{background:var(--tinta);color:var(--papel)}
:focus-visible{outline:2px solid var(--tinta);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <a class="brand" href="/">Ynera</a>
  <h1>Esta página no existe.</h1>
  <p class="poem">La rama que buscabas no creció acá.</p>
  <p>Puede que el enlace esté mal escrito o que la página se haya movido. Volvé al inicio o escribinos si buscabas algo puntual.</p>
  <div class="row">
    <a class="btn fill" href="/">Volver al inicio</a>
    <a class="btn" href="https://cal.com/ynera/30min" target="_blank" rel="noopener">Pedí tu diagnóstico sin costo</a>
  </div>
</main>
</body>
</html>
