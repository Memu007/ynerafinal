<style>
:root{color-scheme:dark;--night:#06070C;--rule:#1D2130;--bone:#E9E5D9;--mute:#8F8D82;--root:#FF9A1F;
  --f:"Archivo","Arial Narrow","Roboto Condensed","Helvetica Neue",Arial,sans-serif;--serif:"EB Garamond",Garamond,"Times New Roman",serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;background:var(--night);color:var(--bone);font:400 17px/1.6 var(--f);-webkit-font-smoothing:antialiased;padding:32px 16px}
main{width:min(100%,560px);display:grid;gap:22px;border-top:1px solid var(--rule);padding-top:16px}
.mono{font:400 11.5px/1.5 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
svg{width:72px;height:auto;display:block;margin-top:24px}
h1{margin:0;font-size:clamp(44px,9vw,76px);font-stretch:62%;font-weight:700;line-height:.9;letter-spacing:-.018em}
.poem{margin:0;font:italic 400 clamp(22px,4vw,28px)/1.25 var(--serif)}
p{margin:0;color:var(--mute)}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
a.btn{display:inline-flex;align-items:center;gap:12px;font:600 15px/1 var(--f);text-decoration:none;padding:16px 22px;border:1px solid var(--bone);color:var(--bone);transition:background .2s,color .2s,border-color .2s}
a.btn.fill{background:var(--bone);color:var(--night)}
a.btn.fill:hover{background:var(--root);border-color:var(--root)}
a.btn:not(.fill):hover{background:var(--bone);color:var(--night)}
:focus-visible{outline:2px solid var(--root);outline-offset:3px}
</style>
</head>
